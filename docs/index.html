<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="https://geekgroup.app/favicon/favicon-96x96.png">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B4F9D" />
    <meta name="description" content="geekGroup URL creator" />
    <title>BG Play Selection</title>
    <style>
        /* BGG Inspired Palette */
        :root {
            --bgg-blue: #0B4F9D;
            --bgg-light-blue: #DDEEFF;
            --bgg-orange: #FF5100;
            --bgg-white: #FFFFFF;
            --bgg-light-gray: #F8F8F8;
            --bgg-medium-gray: #EEEEEE;
            --bgg-dark-gray: #333333;
            --bgg-border-gray: #DDDDDD;
        }

        /* Basic Reset & Font */
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bgg-light-gray);
            color: var(--bgg-dark-gray);
            font-size: 14px;
        }

        * {
            box-sizing: border-box;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-areas:
                'header header header header header header'
                'left main main main main right'
                'footer footer footer footer footer footer';
            padding: 0;
            gap: 1px;
            background-color: var(--bgg-border-gray);
            min-height: 100vh;
            grid-template-rows: auto minmax(0, 1fr) auto;
        }

        .grid-container>div {
            /* background-color: var(--bgg-white); */
            /* Applied individually */
            padding: 15px;
            font-size: inherit;
        }

        /* Header Styling */
        .header {
            grid-area: header;
            background-color: #0B4F9D;
            /* Direct Hex */
            color: var(--bgg-white);
            padding: 10px 15px;
            font-size: 1.2em;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 50px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h3 {
            margin: 0;
            font-weight: bold;
            font-size: 1.4em;
            flex-shrink: 0;
        }

        .header-links {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .header-links a {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            opacity: 1.0;
            line-height: 0;
        }

        .header-links a:hover {
            transform: scale(1.1);
        }

        .header-links a img {
            width: 24px;
            height: 24px;
            vertical-align: middle;
            border-radius: 3px;
        }

        .header-links a svg {
            width: 24px;
            height: 24px;
            fill: var(--bgg-white);
            vertical-align: middle;
        }

        /* Sidebars */
        .left,
        .right {
            grid-area: left;
            background-color: var(--bgg-light-gray);
        }

        .right {
            grid-area: right;
        }

        /* Main Content */
        .main {
            grid-area: main;
            text-align: left;
            background-color: var(--bgg-white);
            padding: 15px;
        }

        /* Footer */
        .footer {
            grid-area: footer;
            background-color: var(--bgg-medium-gray);
            color: var(--bgg-dark-gray);
            text-align: center;
            font-size: 0.85em;
            padding: 10px 15px;
        }

        .footer small {
            display: block;
        }

        /* Content Styling */
        form {
            padding: 0;
        }

        /* BGG Widget container */
        .bgg-widget-container {
            margin-bottom: 30px;
            padding: 15px;
            background-color: var(--bgg-white);
            border: 1px solid var(--bgg-border-gray);
            border-radius: 4px;
            text-align: center;
        }

        .bgg-widget-container h4 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #0B4F9D; /* Direct Hex */
            font-size: 1.2em;
            border-bottom: 1px solid var(--bgg-medium-gray);
            padding-bottom: 5px;
        }

        .bgg-widget-container img {
            max-width: 100%;
            height: auto;
        }

        /* Form Section Titles */
        h4 {
            color: #0B4F9D; /* Direct Hex */
            margin: 25px 0 10px 0;
            border-bottom: 1px solid var(--bgg-medium-gray);
            padding-bottom: 5px;
            font-size: 1.2em;
        }

        .bgg-widget-container+.bgg-widget-container>form>h4:first-of-type {
            margin-top: 0;
        }


        /* Groups Container: 2 Columns */
        #groups-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding-top: 10px;
        }

        /* Details Element Styling */
        details.group-details {
            border: 1px solid var(--bgg-border-gray);
            padding: 0;
            border-radius: 4px;
            background-color: var(--bgg-white);
            overflow: hidden;
            margin: 0;
        }

        details.group-details summary {
            font-weight: bold;
            cursor: pointer;
            color: var(--bgg-dark-gray);
            margin: 0;
            padding: 10px 15px;
            background-color: var(--bgg-medium-gray);
            border-bottom: 1px solid var(--bgg-border-gray);
            transition: background-color 0.2s ease;
            list-style: none; /* Remove marker space */
            position: relative;
        }

        a.group-link {
            float: right;
            margin-left: 10px;
        }

        img.group-link-icon {
            width: 16px;
            height: 16px;
            display: block;
        }

        span.group-text {
            overflow: hidden;
            display: block;
        }

        /* Hide Summary Arrow/Marker */
        details.group-details summary::-webkit-details-marker {
            display: none; /* Chrome/Safari/Edge */
        }

        details.group-details summary::marker {
            display: none; /* Firefox */
        }

        details.group-details:hover summary {
            background-color: #e0e0e0;
        }

        details.group-details[open] summary {
            background-color: var(--bgg-light-blue);
            border-bottom: 1px solid var(--bgg-border-gray);
        }

        details.group-details>*:not(summary) {
            padding: 15px;
        }

        /* Select List Styling */
        details.group-details select[multiple] {
            width: 100%;
            min-height: 100px;
            border: 1px solid var(--bgg-border-gray);
            border-radius: 4px;
            padding: 5px;
            font-size: 1em;
        }

        details.group-details select[multiple] option {
            padding: 5px 8px;
        }

        details.group-details select[multiple] option:checked {
            background-color: #0B4F9D; /* Direct Hex */
            color: var(--bgg-white);
        }

        /* Player Count Section Styling */
        .playercount-container {
            margin: 20px 0 10px 0;
            padding: 15px;
            border: 1px solid var(--bgg-border-gray);
            border-radius: 4px;
            background-color: var(--bgg-light-gray);
        }

        .number-input {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .number-input label {
            margin: 0;
        }

        input[type=radio] {
            margin-right: 3px;
        }

        /* Buttons Styling */
        button,
        input[type=submit],
        input[type=reset] {
            padding: 8px 18px;
            border-radius: 4px;
            border: 1px solid transparent;
            cursor: pointer;
            margin: 5px;
            font-size: 1em;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        button.spinner {
            background-color: var(--bgg-medium-gray);
            color: var(--bgg-dark-gray);
            border-color: var(--bgg-border-gray);
            font-weight: bold;
            padding: 5px 10px;
        }

        button.spinner:hover {
            background-color: #dcdcdc;
            border-color: #c0c0c0;
        }

        button.spinner:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type=submit] {
            background-color: #0B4F9D; /* Direct Hex */
            color: var(--bgg-white);
            border-color: #0B4F9D; /* Direct Hex */
            font-weight: bold;
        }

        input[type=submit]:hover {
            background-color: #084181;
            border-color: #084181;
        }

        input[type=reset] {
            background-color: var(--bgg-white);
            color: #0B4F9D; /* Direct Hex */
            border: 1px solid var(--bgg-border-gray);
        }

        input[type=reset]:hover {
            background-color: var(--bgg-light-gray);
            border-color: #c0c0c0;
        }

        /* Input Number Styling */
        input[type=number] {
            -moz-appearance: textfield;
            width: 60px;
            text-align: center;
            padding: 6px;
            border: 1px solid var(--bgg-border-gray);
            border-radius: 4px;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Button Group Wrapper */
        .buttongroup-wrapper {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--bgg-medium-gray);
            display: flex;
            justify-content: center;
        }

        .buttongroup {
            display: flex;
            gap: 15px;
        }

        .buttongroup>input {
            margin: 0;
        }

        /* Responsive adjustments for group columns */
        @media (max-width: 768px) {

            /* Adjust breakpoint as needed */
            #groups-container {
                grid-template-columns: 1fr;
                /* Stack to 1 column on smaller screens */
            }
        }
    </style>
    <script type="application/javascript">
        // --- Data Definitions ---

        const groupsData = [

                ]
            },
            {
                id: 'groups/rj3inmzx',
                name: 'Bareelstraat',
                members: [
                    { value: '773962', text: 'Erwin' },
                    { value: '679875', text: 'Wouter' },
                    { value: '1080080', text: 'Koen' },
                    { value: '2539551', text: 'Glenn' },
                ]
            },
            {
                id: 'groups/jtwnazav',
                name: 'Schelle',
                members: [
                    { value: '773962', text: 'Erwin' },
                    { value: '21596', text: 'Pieter' },
                    { value: '681508', text: 'Johan' },
                    { value: '129435', text: 'Ronny' },
                    { value: '349445', text: 'Hilde' },
                    { value: '69680', text: 'Erwin C' }
                ]
            },
            {
                id: 'groups/ameritrash',
                name: 'Ameritrash',
                members: [
                    { value: '773962', text: 'Erwin' },
                    { value: '562831', text: 'Steffen' },
                    { value: '450073', text: 'Hans' },
                ]
            },
            {
                id: 'groups/14btgurt',
                name: 'ACA',
                members: [
                    { value: '773962', text: 'Erwin' },
                    { value: '330275', text: 'Wim' },
                    { value: '1822406', text: 'Arne' },
                    { value: '1458785', text: 'Tom' },
                ]
            },
            {
                id: 'users/duponter',
                name: 'Shelf of Shame',
                members: []
            // },
            // {
                // id: 'groups/ld24eoa4',
                // name: 'Spellenclubs',
                // members: [
                    // { value: '427071', text: 'Forum Mortsel' },
                    // { value: '', text: 'Rafaël' },
                    // { value: '', text: 'Vanessa' },
                    // { value: '', text: 'Christine' },
                // ]
            }
        ];

        // --- Core Functions ---

        /**
         * Handles the toggle event for details elements to ensure only one is open at a time.
         * @param {Event} event - The toggle event object.
         */
        const handleDetailsToggle = (event) => {
            // Check if the element is opening
            if (event.target.open) {
                // Find all sibling details elements within the same form/container
                const allDetails = document.querySelectorAll('#geekGroupQuery details.group-details');
                allDetails.forEach(details => {
                    // If it's not the element that triggered the event and it's open, close it
                    if (details !== event.target && details.open) {
                        details.removeAttribute('open');
                    }
                });
            }
        };

        /**
         * Generates the HTML structure for group selection details elements.
         * @param {Array} data - The groupsData array.
         * @param {string} containerId - The ID of the HTML element to inject the details into.
         */
        const generateGroupDetails = (data, containerId) => {
            const container = document.getElementById(containerId);
            if (!container) {
                console.error(`Container element with ID "${containerId}" not found.`);
                return;
            }
            container.innerHTML = ''; // Clear previous content

            data.forEach(group => {
                // Create main elements
                const details = document.createElement('details');
                details.className = 'group-details';
                details.setAttribute('data-group-id', group.id);

                const summary = document.createElement('summary');
                const summaryText = document.createElement('span');
                summaryText.textContent = group.name;
                summaryText.className = 'group-text'
                summary.appendChild(summaryText);

                const link = document.createElement('a');
                link.href = `https://geekgroup.app/${group.id}/collection`;
                link.className = 'group-link';
                link.target = '_blank';
                link.rel='noopener noreferrer';

                const ggicon = document.createElement('img');
                ggicon.src = 'https://www.google.com/s2/favicons?sz=32&domain=geekgroup.app';
                ggicon.className = 'group-link-icon'
                // ggicon.width = 16;
                // ggicon.height = 16;
                ggicon.alt = `${group.name} at geekgroup.app`;
                link.appendChild(ggicon);

                // summary.appendChild(link)
                details.appendChild(summary);

                // Create select list
                const select = document.createElement('select');
                select.name = 'owners';
                select.multiple = true;
                select.size = Math.max(2, Math.min(group.members.length, 8)); // Dynamic size up to 8

                // Create options for members
                group.members.forEach(member => {
                    const option = document.createElement('option');
                    option.value = member.value;
                    option.textContent = member.text;
                    select.appendChild(option);
                });
                details.appendChild(select);

                // Add event listener for exclusive toggle
                details.addEventListener('toggle', handleDetailsToggle);

                // Add the completed element to the container
                container.appendChild(details);
            });
        };

        /**
         * Handles the form submission, gathers data, and opens the geekGroup URL.
         * @param {Event} event - The form submit event object.
         */
        const onFormSubmit = (event) => {
            event.preventDefault(); // Prevent default form submission

            const data = new FormData(event.target);
            const params = new URLSearchParams();

            // Find the currently open group details section
            const openDetails = document.querySelector('#geekGroupQuery details.group-details[open]');
            let groupId = 'users/duponter';
            let selectedOwners = [];

            if (openDetails) {
                groupId = openDetails.getAttribute('data-group-id');
                const selectElement = openDetails.querySelector('select[name="owners"]');
                if (selectElement) {
                    // Get the values of the selected options
                    selectedOwners = Array.from(selectElement.selectedOptions).map(option => option.value);
                }
            }

            // Validation: Ensure a group is selected
            if (!groupId) {
                alert("Please select a group by expanding its section.");
                return; // Stop submission
            }

            // Add selected owners to parameters (if any)
            if (selectedOwners.length > 0) {
                // Join the array values with a comma
                // Append the single parameter with the comma-separated string
                params.append('owners', selectedOwners.join(','));
            }
            
            // Add player count parameters
            const count = data.get('count');
            const countType = data.get('count.type');
            if (count && countType) {
                // Format: e.g., count.best=3,3 or count.recommended=3,3
                params.append(countType, `${count},${count}`);
            } else {
                console.warn("Player count type or value missing.");
                // Optionally handle missing count - maybe default?
            }

            // Add fixed parameters
            params.append('expansions', '0');
            params.append('sort', '-weight');

            // Construct and open URL
            const baseUrl = `https://geekgroup.app/${groupId}/collection`;
            const url = `${baseUrl}?${params.toString()}`;
            console.log("Generated URL:", url);
            window.open(url, '_blank'); // Open in a new tab/window
        };

        /** Increments the player count input field value. */
        const increment = (event) => {
            event.preventDefault();
            const counter = document.getElementById('playercount');
            if (!counter) return;
            let currentValue = Number(counter.value);
            let maxValue = Number(counter.max);
            if (currentValue < maxValue) {
                counter.value = currentValue + 1;
                checkSpinnerButtons(); // Update button states
            }
        };

        /** Decrements the player count input field value. */
        const decrement = (event) => {
            event.preventDefault();
            const counter = document.getElementById('playercount');
            if (!counter) return;
            let currentValue = Number(counter.value);
            let minValue = Number(counter.min);
            if (currentValue > minValue) {
                counter.value = currentValue - 1;
                checkSpinnerButtons(); // Update button states
            }
        };

        /** Enables/disables spinner buttons based on the counter value. */
        const checkSpinnerButtons = () => {
            const counter = document.getElementById('playercount');
            const incrementButton = document.querySelector('.spinner.increment');
            const decrementButton = document.querySelector('.spinner.decrement');

            if (!counter || !incrementButton || !decrementButton) return; // Ensure elements exist

            const currentValue = Number(counter.value);
            decrementButton.disabled = (currentValue <= Number(counter.min));
            incrementButton.disabled = (currentValue >= Number(counter.max));
        };

        /** Initializes the page on body load. */
        const onBodyLoad = () => {
            // Generate the group selection UI
            generateGroupDetails(groupsData, 'groups-container');

            // Set up form submission listener
            const form = document.getElementById('geekGroupQuery');
            if (form) {
                form.addEventListener('submit', onFormSubmit);
            } else {
                console.error("Form 'geekGroupQuery' not found.");
            }

            // Set up spinner button listeners
            const incrementButton = document.querySelector('.spinner.increment');
            const decrementButton = document.querySelector('.spinner.decrement');
            if (incrementButton) {
                incrementButton.addEventListener('click', increment);
            }
            if (decrementButton) {
                decrementButton.addEventListener('click', decrement);
            }

            // Set initial state for spinner buttons
            checkSpinnerButtons();
        };

    </script>
</head>
